<!DOCTYPE html>
<html>
<head>
    <title>Test Frontend</title>
    <script>
        // Test the API endpoints
        async function testAPI() {
            console.log('Testing API...');

            try {
                // Test health
                const healthResponse = await fetch('http://127.0.0.1:8001/health');
                console.log('Health:', healthResponse.status);

                // Test parks
                const parksResponse = await fetch('http://127.0.0.1:8001/api/parks');
                const parks = await parksResponse.json();
                console.log('Parks loaded:', parks.length);

                // Test species
                const speciesResponse = await fetch('http://127.0.0.1:8001/api/species');
                const species = await speciesResponse.json();
                console.log('Species loaded:', species.length);

                // Test homepage
                const homeResponse = await fetch('http://127.0.0.1:8001/');
                const html = await homeResponse.text();
                console.log('Homepage loaded:', html.includes('<title>'));
                console.log('Has API functions:', html.includes('window.API'));
                console.log('Has pageInit call:', html.includes('window.pageInit'));

            } catch (error) {
                console.error('API test failed:', error);
            }
        }

        window.onload = testAPI;
    </script>
</head>
<body>
    <h1>Testing Frontend API</h1>
    <p>Check the browser console for results.</p>
    <div id="results"></div>
</body>
</html>
