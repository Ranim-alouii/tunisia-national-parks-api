global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Tunisia Parks API application metrics
  - job_name: 'tunisia-parks-api'
    static_configs:
      - targets: ['app:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # Optional: Redis metrics (if redis_exporter is available)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis:6379']

  # Optional: PostgreSQL metrics (if postgres_exporter is available)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres:9187']
